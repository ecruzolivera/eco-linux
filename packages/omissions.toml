# Every explicitly installed source-machine package outside the chosen manifests
# is classified here. No group is automatically installed or removed.
[groups]
base_system = { reason = "Owned by the basic Arch installation; bootloader/encryption/snapshot migration is out of scope.", packages = ["base", "btrfs-progs", "efibootmgr", "kernel-modules-hook", "limine", "limine-mkinitcpio-hook", "limine-snapper-sync", "linux", "linux-firmware", "linux-headers", "plymouth", "snapper", "wireless-regdb", "zram-generator"] }
hardware = { reason = "Optional hardware support; NVIDIA/headers are detected separately, other firmware/drivers remain the base install's responsibility.", packages = ["asdcontrol", "bolt", "brother-dcp1610w", "egl-wayland", "intel-media-driver", "intel-ucode", "lib32-nvidia-utils", "nvidia-open-dkms", "nvidia-utils", "sof-firmware", "thermald", "vpl-gpu-rt"] }
legacy = { reason = "Alternative desktop/shell utilities and Omarchy wrappers are not part of the selected niri/DMS profile; nothing is removed from existing systems.", packages = ["dog", "gnome-terminal", "hypridle", "hyprland", "hyprland-guiutils", "hyprlock", "hyprpicker", "hyprsunset", "mako", "omarchy-keyring", "omarchy-nvim", "omarchy-walker", "polkit-gnome", "rcm", "swaybg", "swayidle", "swayimg", "swayosd", "thunar", "thunar-archive-plugin", "thunar-media-tags-plugin", "thunar-shares-plugin", "thunar-volman", "udiskie", "uwsm", "vim", "walker", "waybar", "zathura-pdf-poppler"] }
optional = { reason = "Specialized/alternative tools are available separately; review this list before declaring the personal profile complete for your use.", packages = ["arm-none-eabi-binutils", "arm-none-eabi-gcc", "arm-none-eabi-newlib", "avr-binutils", "avr-gcc", "avr-gdb", "avr-libc", "avrdude", "docker-credential-gcr-bin", "dotnet-runtime-9.0", "elephant", "elephant-bluetooth", "elephant-calc", "elephant-clipboard", "elephant-desktopapplications", "elephant-files", "elephant-menus", "elephant-providerlist", "elephant-runner", "elephant-symbols", "elephant-todo", "elephant-unicode", "elephant-websearch", "fcitx5-gtk", "ibus", "kvantum-qt5", "mmdr-bin", "pamixer", "pipewire-jack", "python-intelhex", "python-sounddevice", "python-soundfile", "python-terminaltexteffects", "tzupdate", "wine", "winetricks"] }
dependencies = { reason = "Supplied through selected packages/AUR recipes, or historical explicit dependencies; do not restore them solely because they were explicit.", packages = ["electron42", "gst-plugin-pipewire", "gst-plugin-va", "libappindicator", "pgadmin4-server-bin", "python-pillow", "python-pillow-heif", "python-pillow-jpegxl-plugin", "python-poetry-core", "python-pyqt6", "qt6-wayland", "quickshell", "resvg", "tumbler", "usage"] }
aliases = { reason = "Replaced by declared upstream alternatives: localsend-bin and xdg-terminal-exec-git.", packages = ["localsend", "xdg-terminal-exec"] }
external = { reason = "No verified compatible Arch/AUR replacement; restore Wonderdraft from licensed media, and package the current Ruby tobi-try separately (try-cli is a different program).", packages = ["tobi-try", "wonderdraft"] }
