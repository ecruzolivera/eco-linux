[commit.generation]
command = "opencode run -m opencode-go/minimax-m2.7"

[list]
json-schema = 2

[post-start]
copy = """
{% if remote_url in ["git@gitlab.com:edde3/mesacontrol.git", "git@gitlab.com:edde3/mesacontrol", "https://gitlab.com/edde3/mesacontrol.git", "https://gitlab.com/edde3/mesacontrol", "ssh://git@gitlab.com/edde3/mesacontrol.git", "ssh://git@gitlab.com/edde3/mesacontrol"] %}
if [ ! -f .mesa-worktree/cache-ready ]; then wt step copy-ignored; fi
{% else %}
wt step copy-ignored
{% endif %}
"""
workspace = """
source "$HOME/.local/bin/eco-herdr-lib"
W={{ worktree_path }}
eco_ensure_herdr_server
eco_create_herdr_workspace "$W" new
"""

[post-remove]
workspace = """
source "$HOME/.local/bin/eco-herdr-lib"
W={{ worktree_path }}
eco_close_herdr_workspace "$W"
"""
