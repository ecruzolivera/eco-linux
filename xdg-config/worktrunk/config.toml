[commit.generation]
command = "opencode run -m opencode-go/minimax-m2.7"

[list]
json-schema = 2

[post-start]
copy = "wt step copy-ignored"
workspace = """
source /home/ernesto/.local/bin/eco-herdr-lib
W={{ worktree_path }}
eco_ensure_herdr_server
eco_create_herdr_workspace "$W" new
"""

[pre-remove]
workspace = """
source /home/ernesto/.local/bin/eco-herdr-lib
W={{ worktree_path }}
eco_close_herdr_workspace "$W"
"""
